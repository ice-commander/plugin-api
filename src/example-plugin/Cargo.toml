[package]
name = "ic-example-plugin"
version = "0.1.0"
edition = "2021"
description = "A plugin that registers one of everything, so the checker has something to check"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ic-plugin-api = { workspace = true }

[features]
default = ["export-abi"]
export-abi = []
